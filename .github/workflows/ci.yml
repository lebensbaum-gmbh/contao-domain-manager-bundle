name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feature/backup-restore-workspace
      - feature/scalable-domain-workspace

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, openssl
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Configure Composer plugins
        run: |
          composer config allow-plugins.contao/manager-plugin true
          composer config allow-plugins.contao-components/installer true
          composer config allow-plugins.php-http/discovery false

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Validate JavaScript syntax
        run: |
          node --check public/js/domain-manager-updates.js
          node --check public/js/domain-manager-workspace.js
          node --check public/js/domain-manager.js

      - name: Lint PHP files
        run: find src contao tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit tests
        run: composer test

      - name: Render Free and Pro browser fixtures
        if: matrix.php == '8.4'
        run: php tests/Browser/render_workspace.php

      - name: Check workspace with 80 installations
        if: matrix.php == '8.4'
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node tests/Browser/workspace.mjs

      - name: Keep browser screenshots for review
        if: always() && matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-browser-review
          path: build/browser/
          retention-days: 7
